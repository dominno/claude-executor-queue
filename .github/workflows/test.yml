name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest no longer offers Python 3.8; 22.04 still does.
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=7,<8.4'
      - run: python -m pytest -q tests
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_TERMINAL_PROMPT: '0'

  skills-install:
    name: Install with skills CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Discover, install and run the skill
        shell: bash
        run: |
          source_dir="$GITHUB_WORKSPACE"
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/executor-queue.XXXXXX")

          run_isolated() {
            env -i PATH="$PATH" HOME="$profile_dir" LC_ALL=C.UTF-8 \
              CI=true NO_COLOR=1 DISABLE_TELEMETRY=1 GIT_ALLOW_PROTOCOL=file GIT_TERMINAL_PROMPT=0 \
              HTTPS_PROXY="${HTTPS_PROXY:-}" HTTP_PROXY="${HTTP_PROXY:-}" \
              NO_PROXY="${NO_PROXY:-}" NODE_EXTRA_CA_CERTS="${NODE_EXTRA_CA_CERTS:-}" \
              NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_CACHE="$smoke_dir/npm-cache" "$@"
          }

          for scope in project global; do
            profile_dir="$smoke_dir/$scope/profile"
            project_dir="$smoke_dir/$scope/project"
            mkdir -p "$profile_dir" "$project_dir"
            cd "$project_dir"
            run_isolated git init -q

            if [[ "$scope" == project ]]; then
              run_isolated npx --yes skills@1.9.0 add "$source_dir" --list \
                | grep -E '^[^[:alnum:]]*executor-queue[[:space:]]*$'
              scope_options=()
              install_dir="$project_dir/.claude/skills/executor-queue"
            else
              scope_options=(--global)
              install_dir="$profile_dir/.claude/skills/executor-queue"
            fi

            run_isolated npx --yes skills@1.9.0 add "$source_dir" \
              --skill executor-queue --agent claude-code --yes "${scope_options[@]}"
            inventory=$(find -L "$install_dir" -type f -printf '%P\n' | LC_ALL=C sort)
            test "$inventory" = $'LICENSE\nSKILL.md\nscripts/xq.py'
            for file in LICENSE SKILL.md scripts/xq.py; do
              cmp "$source_dir/skills/executor-queue/$file" "$install_dir/$file"
            done
            run_isolated python3 "$install_dir/scripts/xq.py" init --local
            status=$(run_isolated python3 "$install_dir/scripts/xq.py" status)
            printf '%s\n' "$status"
            test "$status" = 'no tasks'
            run_isolated python3 "$install_dir/scripts/xq.py" status --state running --json \
              | run_isolated python3 -c 'import json, sys; assert json.load(sys.stdin) == {"schema_version": 1, "tasks": []}'
          done

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=7,<8.4'
      # The full suite uses POSIX launchers and fake executors on Ubuntu/macOS.
      - name: Test the PowerShell installer and release files
        run: python -m pytest -q tests/test_install.py -k "windows_native_install or powershell_launcher_probe or release_markers or example_json or installer_transaction or clean_32_update"
      - name: Test the queue on Windows
        run: >-
          python -m pytest -q tests/test_xq.py tests/test_xq_contract.py
          -k "council_11 or council_12 or council_13_windows or council_14
          or n9_windows_load_fallback or duplicate_assignment_transaction_lock
          or fixture_environment_ignores_inherited_overrides
          or open_status_shows_running_and_unverified_done or status_json
          or codex_poll_uses_dispatch_project_across_worktrees"
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_TERMINAL_PROMPT: '0'
