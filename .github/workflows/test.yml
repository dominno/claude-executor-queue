name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=7,<8.4'
      - run: python -m pytest -q tests
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_TERMINAL_PROMPT: '0'

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=7,<8.4'
      # Exercise the native runtime/PowerShell surface; POSIX fake CLI fixtures
      # in the full suite are run by the Ubuntu/macOS job above.
      - run: python -m pytest -q tests/test_install.py tests/test_xq.py -k "council_16 or council_11 or council_12 or council_13_windows or council_14 or release_markers"
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_TERMINAL_PROMPT: '0'
